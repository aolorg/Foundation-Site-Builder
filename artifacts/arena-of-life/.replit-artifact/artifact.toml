kind = "web"
previewPath = "/"
title = "Arena of Life Foundation"
version = "1.0.0"
id = "artifacts/arena-of-life"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/arena-of-life run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arena-of-life", "run", "build" ]
publicDir = "artifacts/arena-of-life/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
